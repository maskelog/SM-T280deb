# Power key defaults (per-user overrides: ~/.config/sm-t280/power.conf, see
# "Power button" in the XFCE settings menu)
# SHORT_PRESS = sleep | lock | menu | nothing
# LONG_PRESS  = menu | poweroff | nothing   (held for 1 s)
# LOCK_ON_SLEEP = yes | no                  (needs a password: sudo passwd debian)
SHORT_PRESS=sleep
LONG_PRESS=menu
LOCK_ON_SLEEP=yes
