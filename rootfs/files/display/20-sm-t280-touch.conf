# SM-T280 sec_touchscreen: raw axes follow the physical tablet orientation,
# which matches the X screen once 10-sm-t280-fbdev.conf rotates it ("UD").
Section "InputClass"
    Identifier     "sm-t280 touchscreen"
    MatchProduct   "sec_touchscreen"
    MatchDriver    "libinput"
    Option         "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
