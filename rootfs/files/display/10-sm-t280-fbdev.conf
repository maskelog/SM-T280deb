# SM-T280: sprdfb framebuffer, 800x1280 portrait, 32 bpp.
# The panel scans out upside down relative to the tablet (home button at the
# bottom), so the shadow framebuffer is rotated 180 degrees ("UD").
Section "Device"
    Identifier "sprdfb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
    Option     "ShadowFB" "on"
    Option     "Rotate" "UD"
EndSection
